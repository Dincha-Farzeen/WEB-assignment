      input[type="text2"], /* FOR THE SPLIT INPUT*/

      input[type="text2"]:focus,

      input[type="text2"]:hover,
      input[type="text1"]:hover,

        font-size: 95%;

        animation: fadeIn 0.5s ease forwards;

      @keyframes fadeIn {
